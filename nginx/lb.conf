# ----------------------------------------------------
# 1. UPSTREAMS (Definición de Backends)
# ----------------------------------------------------
upstream frontend_cluster {
    # Balanceo de carga de frontends
    server frontend1:80;
    server frontend2:80;
}

upstream backend_app_1 {
    # Back-end 1: GPS App
    server backendgpsapp1:3001;
    server backendgpsapp2:3001; 
}

upstream backend_app_2 {
    # Back-end 2: Spring Boot (Auth/Users/Vehicles)
    server backend2:8080; 
}

upstream grafana_server {
    # Grafana
    server grafana:3000;
}


# ----------------------------------------------------
# 2. REDIRECCIÓN HTTP a HTTPS (Puerto 80 -> 443)
# ----------------------------------------------------
server {
    listen 80;
    server_name localhost;
    # Redirige el puerto 80 al 443. Si estás usando el puerto 8081 en docker-compose, 
    # la redirección solo funcionará internamente, pero es una buena práctica tenerla.
    return 301 https://$host$request_uri;
}


# ----------------------------------------------------
# 3. CONFIGURACIÓN DEL SERVIDOR HTTPS (Puerto 443)
# ----------------------------------------------------
server {
    listen 443 ssl; 
    server_name localhost;

    # Bloque SSL/TLS
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Headers de seguridad HTTP (YA EXISTEN EN TU ARCHIVO, AHORA EN EL LUGAR CORRECTO)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # El CSP puede dar problemas, pero lo dejamos como lo tienes
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https:; frame-ancestors 'self';" always;

    # --- 3.1. Ruteo al Frontend y Balanceo de Carga (Ruta Raíz) ---
    location / {
        proxy_pass http://frontend_cluster;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 3.2. Ruteo al Backend 2 (Spring Boot - /api/users, /api/auth) ---
    # Asume que los controladores en Spring Boot usan /api/ como base
    location /api/ {
        proxy_pass http://backend_app_2; # NGINX manejará el /api/
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 3.3. Ruteo al Backend 1 (GPS App - /gps-api/) ---
    # Usamos un prefijo único para esta app
    location /gps-api/ {
        # Necesitas reescribir la URL para quitar el prefijo /gps-api/ si tu app no lo espera
        rewrite ^/gps-api/(.*)$ /$1 break;
        proxy_pass http://backend_app_1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # --- 3.4. Ruteo a Grafana (Sistema de Logs) ---
    location /grafana/ {
        # Reescribe la URL para que Grafana no reciba /grafana/ en el path
        rewrite ^/grafana/(.*)$ /$1 break;
        proxy_pass http://grafana_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # Asegura que Grafana sepa que es HTTPS
        
        # Headers adicionales para Grafana
        proxy_redirect default; 
        proxy_http_version 1.1; # Necesario para algunas funcionalidades
    }

}