# ============================================
# Rate Limiting Zones
# ============================================
# Zona general: 10 peticiones por segundo por IP
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;

# Zona API: 5 peticiones por segundo por IP (más restrictivo)
limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;

# Zona de login: 3 intentos por minuto por IP
limit_req_zone $binary_remote_addr zone=login:10m rate=3r/m;

# ============================================
# User-Agent Blocking
# ============================================
# Bloquear bots y scrapers maliciosos conocidos
map $http_user_agent $blocked_agent {
    default 0;
    ~*bot 1;
    ~*crawler 1;
    ~*spider 1;
    ~*scrap 1;           # Detecta "scraper", "scrapy", "scraping", etc.
    ~*scanner 1;
    ~*scan 1;            # Detecta "scanning", etc.
    ~*nikto 1;           # Scanner de vulnerabilidades
    ~*nuclei 1;          # Scanner de vulnerabilidades
    ~*sqlmap 1;          # Herramienta de SQL injection
    ~*nmap 1;            # Port scanner
    ~*masscan 1;         # Port scanner masivo
    ~*acunetix 1;        # Scanner comercial
    ~*nessus 1;          # Scanner de vulnerabilidades
    ~*openvas 1;         # Scanner de vulnerabilidades
    ~*metasploit 1;      # Framework de pentesting
    ~*burp 1;            # Burp Suite
    ~*curl 0;            # Permitir curl para testing
    ~*wget 0;            # Permitir wget para healthchecks
}

# ============================================
# Upstream Configuration
# ============================================
upstream frontend_cluster {
    # Balanceo de carga de frontends
    server frontend1:80;
    server frontend2:80;
}

upstream backend_cluster {
    server backend2:3001;
}

# ============================================
# HTTP to HTTPS Redirect
# ============================================
server {
    listen 80;
    server_name localhost;
    # Redirige el puerto 80 al 443. Si estás usando el puerto 8081 en docker-compose, 
    # la redirección solo funcionará internamente, pero es una buena práctica tenerla.
    return 301 https://$host$request_uri;
}


# ----------------------------------------------------
# 3. CONFIGURACIÓN DEL SERVIDOR HTTPS (Puerto 443)
# ----------------------------------------------------
server {
    listen 443 ssl; 
    server_name localhost;

    # Bloque SSL/TLS
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Headers de seguridad HTTP (YA EXISTEN EN TU ARCHIVO, AHORA EN EL LUGAR CORRECTO)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://unpkg.com; style-src 'self' 'unsafe-inline' https://unpkg.com; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' http://localhost:* https:; frame-ancestors 'self';" always;

    # ============================================
    # WAF / Rate Limiting Protection
    # ============================================
    # Bloquear user-agents maliciosos
    if ($blocked_agent) {
        return 403 '{"error": "Forbidden - Malicious user-agent detected"}';
    }

    # Registrar peticiones bloqueadas
    access_log /var/log/nginx/access.log combined;
    error_log /var/log/nginx/error.log warn;

    # Grafana login con rate limiting estricto
    location ~ ^/grafana/(login|api/login|api/auth) {
        limit_req zone=login burst=2 nodelay;
        limit_req_status 429;
        
        rewrite ^/grafana/(.*) /$1 break;
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Grafana general
    location /grafana/ {
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;
        
        rewrite ^/grafana/(.*) /$1 break;
        proxy_pass http://grafana:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Endpoints de autenticación con rate limiting estricto (3 intentos por minuto)
    location ~ ^/api/auth/(login|register) {
        limit_req zone=login burst=2 nodelay;
        limit_req_status 429;
        
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # API endpoints con rate limiting medio (5 req/s)
    location /api/ {
        limit_req zone=api burst=10 nodelay;
        limit_req_status 429;
        
        proxy_pass http://backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Frontend general con rate limiting básico
    location / {
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;
        
        proxy_pass http://frontend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- 3.3. Ruteo al Backend 1 (GPS App - /gps-api/) ---
    # Usamos un prefijo único para esta app
    location /gps-api/ {
        # Necesitas reescribir la URL para quitar el prefijo /gps-api/ si tu app no lo espera
        rewrite ^/gps-api/(.*)$ /$1 break;
        proxy_pass http://backend_app_1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
    
    # --- 3.4. Ruteo a Grafana (Sistema de Logs) ---
    location /grafana/ {
        # Reescribe la URL para que Grafana no reciba /grafana/ en el path
        rewrite ^/grafana/(.*)$ /$1 break;
        proxy_pass http://grafana_server;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # Asegura que Grafana sepa que es HTTPS
        
        # Headers adicionales para Grafana
        proxy_redirect default; 
        proxy_http_version 1.1; # Necesario para algunas funcionalidades
    }

}